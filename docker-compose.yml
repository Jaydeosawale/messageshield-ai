services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messageshield}
      POSTGRES_USER: ${POSTGRES_USER:-messageshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-messageshield} -d ${POSTGRES_DB:-messageshield}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"

    ports:
      - "5002:5000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy

    ports:
      - "8002:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    restart: unless-stopped


volumes:
  postgres_data: