name: messageshield
description: Privacy-first AI message safety assistant
publish_to: "none"

version: 0.2.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

# ==========================================
# Dependencies
# ==========================================

dependencies:
  flutter:
    sdk: flutter

  # ==========================================
  # UI
  # ==========================================
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0

  # ==========================================
  # State Management
  # ==========================================
  provider: ^6.1.5+1

  # Keep only if you are using Riverpod somewhere
  flutter_riverpod: ^2.5.1

  # ==========================================
  # Networking
  # ==========================================
  dio: ^5.5.0
  http: ^1.6.0

  # ==========================================
  # Navigation
  # ==========================================
  go_router: ^14.2.0

  # ==========================================
  # Secure Storage
  # JWT storage
  # ==========================================
  flutter_secure_storage: ^11.0.0

  # ==========================================
  # Firebase
  # ==========================================
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1

  # ==========================================
  # Google Sign-In
  # Android + iOS + Web
  # ==========================================
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1

# ==========================================
# Development Dependencies
# ==========================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # ==========================================
  # App Icon Generation
  # ==========================================
  flutter_launcher_icons: ^0.14.4

# ==========================================
# Flutter Configuration
# ==========================================

flutter:
  uses-material-design: true

  assets:
    - assets/images/messageshield_logo.png

# ==========================================
# App Icons
# ==========================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/messageshield_logo.png"

  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/images/messageshield_logo.png"
    background_color: "#08111F"
    theme_color: "#08111F"